<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tulipán ❤️</title>

<style>

/* =========================
   FONDO
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================
   CONTENEDOR
========================= */

.scene {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* =========================
   TULIPÁN
========================= */

.tulip {
    position: relative;
    width: 300px;
    height: 500px;

    animation: balanceo 4s ease-in-out infinite;
}


/* =========================
   FLOR
========================= */

.flower {
    position: absolute;

    width: 220px;
    height: 190px;

    top: 35px;
    left: 40px;

    z-index: 5;
}


/* PÉTALOS */

.petal {
    position: absolute;

    width: 105px;
    height: 170px;

    bottom: 0;

    border-radius:
        55% 55% 45% 45%
        / 65% 65% 35% 35%;

    background:
        radial-gradient(
            ellipse at 50% 80%,
            #ffb300 0%,
            #ff5e00 25%,
            #e60023 65%,
            #6b0015 100%
        );

    box-shadow:
        0 0 10px #ff4500,
        0 0 25px rgba(255, 60, 0, .5);

    transform-origin: bottom center;
}


/* Pétalo izquierdo */

.petal.left {
    left: 5px;
    transform: rotate(-20deg);
}


/* Pétalo derecho */

.petal.right {
    right: 5px;
    transform: rotate(20deg);
}


/* Pétalo central */

.petal.center {
    width: 120px;
    height: 185px;

    left: 50px;
    z-index: 4;

    background:
        radial-gradient(
            ellipse at 50% 85%,
            #ffbd00 0%,
            #ff4b00 25%,
            #d90025 65%,
            #520010 100%
        );
}


/* Pétalos traseros */

.petal.back-left {
    left: 35px;
    z-index: 1;

    transform:
        rotate(-38deg)
        scale(.85);
}

.petal.back-right {
    right: 35px;
    z-index: 1;

    transform:
        rotate(38deg)
        scale(.85);
}


/* =========================
   CENTRO DE LA FLOR
========================= */

.flower-center {
    position: absolute;

    width: 65px;
    height: 35px;

    left: 78px;
    bottom: 5px;

    z-index: 10;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffd000,
            #ff6500 45%,
            #6b0000 100%
        );

    box-shadow:
        0 0 15px #ff6a00;
}


/* =========================
   TALLO
========================= */

.stem {
    position: absolute;

    width: 18px;
    height: 270px;

    left: 141px;
    top: 200px;

    z-index: 2;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #073b0b,
            #28a428,
            #8bea31,
            #168019,
            #032e08
        );

    box-shadow:
        0 0 12px rgba(80, 255, 40, .5);
}


/* =========================
   HOJAS
========================= */

.leaf {
    position: absolute;

    z-index: 3;

    width: 110px;
    height: 230px;

    background:
        linear-gradient(
            100deg,
            #032b08,
            #116d15,
            #6edb22,
            #0a5410
        );

    box-shadow:
        0 0 12px rgba(80, 255, 40, .35);

    border-radius:
        100% 0 100% 0;

    transform-origin: bottom center;
}


/* Hoja izquierda */

.leaf.left {
    left: 55px;
    top: 285px;

    transform:
        rotate(-35deg)
        skewY(-5deg);
}


/* Hoja derecha */

.leaf.right {
    left: 145px;
    top: 270px;

    transform:
        rotate(32deg)
        scale(.9);
}


/* Línea de las hojas */

.leaf::after {
    content: "";

    position: absolute;

    width: 3px;
    height: 90%;

    left: 50%;
    top: 5%;

    background: rgba(180,255,100,.55);

    transform: rotate(-8deg);

    border-radius: 50%;
}


/* =========================
   TEXTO
========================= */

.text {
    position: absolute;

    bottom: 35px;

    width: 90%;

    text-align: center;

    color: white;

    font-size: 24px;

    line-height: 1.5;

    text-shadow:
        0 0 5px white,
        0 0 15px rgba(255,255,255,.5);

    animation: aparecer 3s ease forwards;
}


/* Corazón */

.heart {
    margin-top: 10px;

    font-size: 30px;

    color: #ff3155;

    text-shadow:
        0 0 10px #ff3155,
        0 0 25px #ff3155;

    animation: latido 1.5s infinite;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes balanceo {

    0% {
        transform: rotate(-1deg);
    }

    50% {
        transform: rotate(1.5deg);
    }

    100% {
        transform: rotate(-1deg);
    }
}


@keyframes latido {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

    100% {
        transform: scale(1);
    }
}


@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    .tulip {
        transform: scale(.8);
    }

    .text {
        font-size: 19px;
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="tulip">

        <!-- FLOR -->

        <div class="flower">

            <div class="petal back-left"></div>
            <div class="petal back-right"></div>

            <div class="petal left"></div>
            <div class="petal right"></div>

            <div class="petal center"></div>

            <div class="flower-center"></div>

        </div>


        <!-- TALLO -->

        <div class="stem"></div>


        <!-- HOJAS -->

        <div class="leaf left"></div>
        <div class="leaf right"></div>

    </div>


    <!-- TEXTO -->

    <div class="text">

        Y si la vida me da otra oportunidad...<br>
        que sea a tu lado.
        
        Te Amo Solcito 

        <div class="heart">♡</div>

    </div>

</div>

</body>
</html>
